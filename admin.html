<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель - Галерея</title>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0b0f;
            --bg-secondary: #12141a;
            --bg-card: #1a1d26;
            --text-primary: #e8eaed;
            --text-secondary: #9ca3af;
            --accent-blue: #4f8ff7;
            --accent-cyan: #3b9eff;
            --border-color: rgba(79, 143, 247, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            padding: 2rem;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            font-family: 'Unbounded', sans-serif;
            font-size: 2rem;
            margin-bottom: 2rem;
            text-align: center;
        }

        .upload-section {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 2rem;
            margin-bottom: 3rem;
        }

        .upload-form {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        label {
            font-size: 0.9rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        input[type="text"] {
            padding: 0.8rem;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 0.95rem;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--accent-cyan);
        }

        .file-input-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
            background: var(--bg-secondary);
            border: 2px dashed var(--border-color);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .file-input-wrapper:hover {
            border-color: var(--accent-cyan);
            background: rgba(79, 143, 247, 0.05);
        }

        .file-input-wrapper input[type="file"] {
            position: absolute;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }

        .file-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .preview-container {
            margin-top: 1rem;
            text-align: center;
        }

        .preview-container img {
            max-width: 100%;
            max-height: 300px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .upload-btn {
            padding: 1rem 2rem;
            background: var(--accent-blue);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .upload-btn:hover {
            background: var(--accent-cyan);
            transform: translateY(-2px);
        }

        .gallery-section {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 2rem;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-top: 1.5rem;
        }

        .gallery-item {
            position: relative;
            aspect-ratio: 1;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .gallery-item-info {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(10, 11, 15, 0.9), transparent);
            padding: 1rem;
            font-size: 0.85rem;
        }

        .delete-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(255, 59, 48, 0.9);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 0.5rem 0.8rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .delete-btn:hover {
            background: rgba(255, 59, 48, 1);
            transform: scale(1.05);
        }

        .back-link {
            display: inline-block;
            margin-bottom: 2rem;
            color: var(--accent-cyan);
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .back-link:hover {
            transform: translateX(-5px);
        }

        .status-message {
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            text-align: center;
        }

        .status-success {
            background: rgba(52, 211, 153, 0.1);
            border: 1px solid rgba(52, 211, 153, 0.3);
            color: #34d399;
        }

        .status-error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #ef4444;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="portfolio.html" class="back-link">← Вернуться на сайт</a>
        
        <h1>🎨 Админ-панель галереи</h1>

        <div id="statusMessage"></div>

        <div class="upload-section">
            <h2 style="margin-bottom: 1.5rem;">Загрузить изображение</h2>
            <form id="uploadForm" class="upload-form">
                <div class="form-group">
                    <label for="imageTitle">Название работы (опционально)</label>
                    <input type="text" id="imageTitle" name="title" placeholder="Например: Дизайн логотипа">
                </div>
                
                <div class="form-group">
                    <label>Выберите изображение</label>
                    <div class="file-input-wrapper">
                        <input type="file" id="imageFile" name="image" accept="image/*" required>
                        <div class="file-icon">📁</div>
                        <div>Нажмите или перетащите файл</div>
                    </div>
                    <div class="preview-container" id="previewContainer"></div>
                </div>

                <button type="submit" class="upload-btn">Загрузить в галерею</button>
            </form>
        </div>

        <div class="gallery-section">
            <h2>Текущие изображения</h2>
            <div class="gallery-grid" id="galleryGrid"></div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:5000/api';

        // Превью изображения
        document.getElementById('imageFile').addEventListener('change', function(e) {
            const file = e.target.files[0];
            const preview = document.getElementById('previewContainer');
            
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.innerHTML = `<img src="${e.target.result}" alt="Preview">`;
                };
                reader.readAsDataURL(file);
            }
        });

        // Загрузка изображения
        document.getElementById('uploadForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = new FormData(this);
            const statusMessage = document.getElementById('statusMessage');
            
            try {
                const response = await fetch(`${API_URL}/gallery/upload`, {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();
                
                if (result.success) {
                    statusMessage.innerHTML = '<div class="status-message status-success">✓ Изображение успешно загружено!</div>';
                    this.reset();
                    document.getElementById('previewContainer').innerHTML = '';
                    loadGallery();
                    
                    setTimeout(() => {
                        statusMessage.innerHTML = '';
                    }, 3000);
                } else {
                    statusMessage.innerHTML = `<div class="status-message status-error">✗ Ошибка: ${result.error}</div>`;
                }
            } catch (error) {
                console.error('Ошибка загрузки:', error);
                statusMessage.innerHTML = '<div class="status-message status-error">✗ Ошибка загрузки изображения</div>';
            }
        });

        // Загрузка галереи
        async function loadGallery() {
            try {
                const response = await fetch(`${API_URL}/gallery`);
                const images = await response.json();
                
                const galleryGrid = document.getElementById('galleryGrid');
                
                if (images.length === 0) {
                    galleryGrid.innerHTML = '<p style="text-align: center; color: var(--text-secondary);">Галерея пуста</p>';
                    return;
                }
                
                galleryGrid.innerHTML = '';
                
                images.forEach(image => {
                    const item = document.createElement('div');
                    item.className = 'gallery-item';
                    
                    const imgSrc = `${API_URL.replace('/api', '')}/uploads/${image.filename}`;
                    
                    item.innerHTML = `
                        <img src="${imgSrc}" alt="${image.title || 'Gallery image'}">
                        ${image.title ? `<div class="gallery-item-info">${image.title}</div>` : ''}
                        <button class="delete-btn" onclick="deleteImage(${image.id})">🗑️</button>
                    `;
                    
                    galleryGrid.appendChild(item);
                });
            } catch (error) {
                console.error('Ошибка загрузки галереи:', error);
            }
        }

        // Удаление изображения
        async function deleteImage(id) {
            if (!confirm('Удалить это изображение?')) return;
            
            try {
                const response = await fetch(`${API_URL}/gallery/${id}`, {
                    method: 'DELETE'
                });
                
                if (response.ok) {
                    loadGallery();
                }
            } catch (error) {
                console.error('Ошибка удаления:', error);
                alert('Ошибка удаления изображения');
            }
        }

        // Загружаем галерею при загрузке страницы
        loadGallery();
    </script>
</body>
</html>
